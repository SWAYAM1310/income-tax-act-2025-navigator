services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statnav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statnav}
      POSTGRES_DB: ${POSTGRES_DB:-statnav}
    ports:
      # 5433 on the host to avoid clashing with any local Postgres install
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statnav} -d ${POSTGRES_DB:-statnav}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
