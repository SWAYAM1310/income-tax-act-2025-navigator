# Keyless CI: nothing here calls Jina or Groq, and nothing needs the source PDF or the index.
# - python: lint + the offline tests (database and Jina tests are deselected; tests that need
#   the parsed PDF skip themselves).
# - frontend: lint, type-check + build, and the Playwright smoke test, whose API is mocked with
#   fixtures captured from the real one (frontend/e2e/fixtures).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests evals scripts tasks.py
      - run: uv run pytest -q -m "not jina and not db"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
