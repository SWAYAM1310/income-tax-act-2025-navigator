[project]
name = "statnav"
version = "0.1.0"
description = "Amendment-aware statute navigator for the Income-tax Act, 2025 (RAG + eval pipeline)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.28",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "langgraph>=1.2.14",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statnav"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the Postgres container running",
    "jina: calls the Jina API (needs JINA_API_KEY)",
]

[tool.ruff.lint.isort]
known-first-party = ["statnav", "evals"]
