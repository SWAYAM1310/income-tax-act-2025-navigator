# v8: v6 with explicit endnotes (`retrieve/amend.py`, style "explicit").
#
# The amendment_direction metric (added 2026-10-06) showed v4-v7 stating substitutions
# backwards: the Act's endnote `Sub. for "60%"` means 60% is the *earlier* wording, and the model
# read it as "substituted with 60%" (v6: section 195(1)(i) went "from 30% to 60%"; the Act says
# 60% -> 30%). The explicit style adds `wording before: "60%"; wording now: "30%"` (old words from
# the endnote, new words from the bracket the endnote tags in the provision), and
# `inserted (not in the Act before): "..."` for insertions. Everything else is v6. (v7's
# verifier gate is left out: it measured as a no-op at +83% tokens.)
description: v6 + endnotes that state the wording before and after each change
chunks: v2
retrieval:
  mode: hybrid
  k: 10
  pool: 30
  retrievers: [dense, ids, under]
  weights: {dense: 1.0, ids: 2.0, under: 1.0, fts: 1.0}
  endnotes: explicit
  xref: {seed_n: 3, keep: 4, slots: 2, both_ways: true}
agent:
  scope_check: true
  definitions: true
evidence_budget: 4500
generation: {prompt: basic}
