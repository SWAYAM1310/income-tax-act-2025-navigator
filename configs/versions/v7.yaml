# v7: v6 plus a citation verifier (`statnav/agent/verify.py`, the graph's `verify` node).
#
# Measured before building, on v6's dev_mini answers: simple deterministic checks (numbers in
# the cited text, named provisions cited) flag mostly false positives, and grounded numbers are
# already 1.000. The real remaining error is under-citation -- multi-hop answers that rely on
# two passages and cite one (v6 citation recall 0.896, multi-hop fact recall 0.50 vs the
# oracle's 0.58). So gpt-oss-20b maps every claim to its supporting passages across the whole
# evidence, and a claim with no support sends the answer back for one regeneration
# (gpt-oss-120b) with the claim named.
#
# Measured: the checker found every v6 dev_mini answer supported by the passage it already
# cited, and replacing the citations with its support lowered citation precision 0.958 -> 0.896
# and recall 0.896 -> 0.854. So the citations stay the generator's (verify_citations: false)
# and the checker is a gate; whether the gate catches wrong answers is measured separately by
# `python -m evals.verifier_check` (corrupted answers).
description: v6 + verifier gate - gpt-oss-20b checks claims against the evidence, one retry if unsupported
chunks: v2
retrieval:
  mode: hybrid
  k: 10
  pool: 30
  retrievers: [dense, ids, under]
  weights: {dense: 1.0, ids: 2.0, under: 1.0, fts: 1.0}
  endnotes: structured
  xref: {seed_n: 3, keep: 4, slots: 2, both_ways: true}
agent:
  scope_check: true
  definitions: true
  verify: true
  verify_citations: false   # measured worse on dev_mini; see verify.py
evidence_budget: 4500
generation: {prompt: basic}
