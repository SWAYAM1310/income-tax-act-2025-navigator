# v9: v8 with the explained answer prompt (`answer.py:EXPLAINED_PROMPT`).
#
# Retrieval, evidence and the agent are v8's. Only the generator's instructions change: the answer
# is Markdown written for a non-expert (In short / What this means for you / a block that depends
# on the agent's route / a worked Example / Watch out / Key terms), cites with [Cn] markers in the
# text, and suggests follow-up questions. The grounding rules are v8's. It answers with the
# `answer_explained` role: the same model, a higher token limit (answers are about three times
# longer) and medium reasoning (at low, it read s126's "up to Rs. 25000 in aggregate" for
# "parent or parents" as a limit per parent).
description: v8 + plain-English sectioned answers with a worked example and inline citations
chunks: v2
retrieval:
  mode: hybrid
  k: 10
  pool: 30
  retrievers: [dense, ids, under]
  weights: {dense: 1.0, ids: 2.0, under: 1.0, fts: 1.0}
  endnotes: explicit
  xref: {seed_n: 3, keep: 4, slots: 2, both_ways: true}
agent:
  scope_check: true
  definitions: true
evidence_budget: 4500
generation: {prompt: explained, role: answer_explained}
